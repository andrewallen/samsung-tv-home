    <!-- Scene, back to front: solar sky (fallback), time-of-day photos, stars,

    <div id="motes" class="layer motes"><span class="mote" style="left:1780px;top:465px;width:12px;height:12px;-webkit-animation-duration:24s;animation-duration:24s;-webkit-animation-delay:-27s;animation-delay:-27s"></span><span class="mote" style="left:1509px;top:640px;width:12px;height:12px;-webkit-animation-duration:23s;animation-duration:23s;-webkit-animation-delay:-16s;animation-delay:-16s"></span><span class="mote" style="left:705px;top:615px;width:14px;height:14px;-webkit-animation-duration:19s;animation-duration:19s;-webkit-animation-delay:-5s;animation-delay:-5s"></span><span class="mote" style="left:1110px;top:675px;width:14px;height:14px;-webkit-animation-duration:23s;animation-duration:23s;-webkit-animation-delay:-20s;animation-delay:-20s"></span><span class="mote" style="left:120px;top:451px;width:14px;height:14px;-webkit-animation-duration:28s;animation-duration:28s;-webkit-animation-delay:-5s;animation-delay:-5s"></span><span class="mote" style="left:1213px;top:490px;width:6px;height:6px;-webkit-animation-duration:23s;animation-duration:23s;-webkit-animation-delay:-9s;animation-delay:-9s"></span><span class="mote" style="left:880px;top:490px;width:8px;height:8px;-webkit-animation-duration:17s;animation-duration:17s;-webkit-animation-delay:-17s;animation-delay:-17s"></span><span class="mote" style="left:1793px;top:677px;width:6px;height:6px;-webkit-animation-duration:25s;animation-duration:25s;-webkit-animation-delay:-12s;animation-delay:-12s"></span><span class="mote" style="left:851px;top:448px;width:12px;height:12px;-webkit-animation-duration:26s;animation-duration:26s;-webkit-animation-delay:-23s;animation-delay:-23s"></span><span class="mote" style="left:94px;top:380px;width:14px;height:14px;-webkit-animation-duration:26s;animation-duration:26s;-webkit-animation-delay:-5s;animation-delay:-5s"></span><span class="mote" style="left:497px;top:594px;width:14px;height:14px;-webkit-animation-duration:16s;animation-duration:16s;-webkit-animation-delay:-2     <div class="layer wash"></div>
    <div class="layer shade"></div>
    <div class="topscrim"></div>

    <!-- Thin light arcs, top-left and bottom-left. -->
    <svg class="layer arcs" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <defs>
            <linearGradient id="arc-top" x1="0" y1="1" x2="1" y2="0">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
                <stop offset="0.6" stop-color="#bcd2ff" stop-opacity="0.9"/>
                <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="arc-bottom" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
                <stop offset="0.4" stop-color="#d6e2ff" stop-opacity="0.7"/>
                <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
            </linearGradient>
        </defs>
        <path d="M-20 300 C 160 200, 330 90, 540 -20" fill="none" stroke="url(#arc-top)" stroke-width="10" opacity="0.18"/>
        <path d="M-20 300 C 160 200, 330 90, 540 -20" fill="none" stroke="url(#arc-top)" stroke-width="2.4"/>
        <path d="M60 770 C 420 760, 820 900, 1180 1100" fill="none" stroke="url(#arc-bottom)" stroke-width="8" opacity="0.14"/>
        <path d="M60 770 C 420 760, 820 900, 1180 1100" fill="none" stroke="url(#arc-bottom)" stroke-width="2"/>
    </svg>

    <main id="home">
        <nav id="applist" class="applist"></nav>
        <div id="inputs" class="inputs"></div>
        <div class="divider"></div>

        <section class="nowpanel">
            <div id="time" class="time"></div>
            <div id="date" class="date"></div>
            <div class="rule"></div>
            <div id="weather" class="weather">
                <div class="current">
                    <span id="place" class="place"></span>
                    <span id="wx-glyph" class="wx-glyph"></span>
                    <span id="temperature" class="temperature"></span>
                    <span id="condition" class="condition"></span>
                </div>
                <div id="forecast" class="forecast"></div>
            </div>
        </section>

        <div id="status" class="status"></div>
        <div class="hint">Left and Right to explore the day, Return for settings</div>
        <div id="explore" class="explore">
            <div id="explore-label" class="explore-label"></div>
            <div id="explore-dots" class="explore-dots"></div>
        </div>
    </main>

    <div id="dim" class="dim"></div>

    <div id="settings" class="settings">
        <div class="settings-card">
            <div class="settings-title">Settings</div>
            <div id="set-rows" class="set-rows"></div>
            <input id="set-loc-input" class="set-input" type="text" placeholder="Enter a postcode" autocomplete="off">
            <div class="settings-foot">Up and Down to move. Left, Right or Enter to change. On an app, Enter shows or hides it and Left and Right reorder. Return to close.</div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/sound.js"></script>

    <script src="js/scene.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/launcher.js"></script>
    <script src="js/list.js"></script>
    <script src="js/inputs.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/lock.js"></script>
    <script src="js/idle.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
